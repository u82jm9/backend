# Configure the root logger level (applies to all loggers unless overridden)
.level=INFO
# Specify handlers: ConsoleHandler (logs to console) and FileHandler (logs to file)
handlers=java.util.logging.ConsoleHandler, java.util.logging.FileHandler
# ConsoleHandler configuration
java.util.logging.ConsoleHandler.level=WARNING
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
# FileHandler configuration
java.util.logging.FileHandler.level=INFO
# Log file path (relative to JVM working dir) - %u is a unique number to avoid conflicts, %g is the rotation generation
java.util.logging.FileHandler.pattern=src/main/resources/logs/app%u.log
# Max log file size (50KB)
java.util.logging.FileHandler.limit=10000
# Keep up to 5 rotating log files
java.util.logging.FileHandler.count=5
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter
# Append to existing file instead of overwriting on restart
java.util.logging.FileHandler.append=true