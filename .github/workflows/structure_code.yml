name: correctly-format-code
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: 'semeru'
          java-version: '23.0.2'

      - name: Code formatting with Java Formatter
        run: mvn spotless:apply

